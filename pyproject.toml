# Version: 1.0.0
# Date: 2026-08-07
# Author: NetCheck Contributors
# Changelog: Configure pytest and Ruff for Python 3.13 release validation.

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".git", ".python", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
