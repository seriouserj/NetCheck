# Version: 1.8.0
# Date: 2026-08-12
# Author: Serhii Dralo <dralo@ditis.group>
# Changelog: Publish verified macOS Intel and Windows x86-64 applications together.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Intel application
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate source
        run: |
          python -m ruff check main.py core ui profiles scripts tests
          python -m pytest -q

      - name: Build app bundle
        env:
          PYTHON_BINARY: python
        run: scripts/build_macos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NetCheck-${{ github.ref_name }}-macos-intel
          path: |
            dist/NetCheck-*-macos-*.zip
            dist/NetCheck-*-macos-*.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows x86-64 application
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check main.py core ui profiles scripts tests
          python -m pytest -q
          python scripts/smoke_test.py

      - name: Build portable application
        shell: pwsh
        run: scripts/build_windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NetCheck-${{ github.ref_name }}-windows-x86-64
          path: |
            dist/NetCheck-*-windows-*.zip
            dist/NetCheck-*-windows-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: NetCheck-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber dist/*.zip dist/*.sha256
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
              dist/*.zip dist/*.sha256
          fi
