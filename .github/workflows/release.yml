# Version: 1.0.0
# Date: 2026-08-07
# Author: NetCheck Contributors
# Changelog: Add tagged macOS app build and GitHub Release publication.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Intel application
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate source
        run: |
          python -m ruff check main.py core ui profiles scripts tests
          python -m pytest -q

      - name: Build app bundle
        env:
          PYTHON_BINARY: python
        run: scripts/build_macos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NetCheck-${{ github.ref_name }}-macos-intel
          path: |
            dist/NetCheck-*-macos-*.zip
            dist/NetCheck-*-macos-*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
              dist/NetCheck-*-macos-*.zip dist/NetCheck-*-macos-*.sha256
